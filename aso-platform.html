<style>

:root[data-theme="dark"]{--bg:#121212;--card:#1C1C1C;--ink:#F0F0ED;--ink2:#9C9C97;--line:#2D2D2B;--soft:#262625;--ac:#D2A055;--acs:#33291A;--g:#82BA98;--r:#E08A78}

table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--ink2);font-weight:600;padding:8px 8px 8px 0;font-size:13px}td{padding:11px 8px 11px 0;border-top:1px solid var(--line)}.sc{overflow-x:auto}
.chart{display:flex;gap:10px;align-items:flex-end;height:176px;padding-top:6px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.col em{font-style:normal;font-size:11px;font-weight:700;margin-bottom:3px}.col small{font-size:11px;color:var(--ink2);margin-top:5px}.stk{width:100%;display:flex;flex-direction:column;border-radius:5px 5px 0 0;overflow:hidden;min-height:4px}.stk .nd{background:var(--ac)}.stk .dl{background:var(--ink);flex:1}

label{display:block;font-weight:600;font-size:13px;color:var(--ink2);margin-top:12px}
input[type=text],select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);margin-top:5px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}.ck input{margin-top:3px;accent-color:var(--ac)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;transform:translateY(-160%);transition:transform .25s;z-index:30;max-width:320px}#toast.on{transform:none}
@media(max-width:760px){.two{grid-template-columns:1fr}header,nav{padding-left:14px;padding-right:14px}main{padding:20px 14px 50px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

 const g=RL==='customer'&&auth<3,v=RL==='vendor'&&vob<5;$('nav').style.display=g||v?'none':'';$('view').innerHTML=g?gate():v?vgate():V[RL][t]();scrollTo(0,0)}
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
const stat=(l,v,s='')=>`<div class="stat"><small>${l}</small><div>${v}</div><span>${s}</span></div>`;
const prog=o=>{const i=FLOW.indexOf(o.st);return i<0?'':`<div class="steps">${FLOW.map((_,j)=>`<i class="${j<=i?'d':''}"></i>`).join('')}</div>`};
const money=()=>{const x=['rejected','cancel'],live=O.filter(o=>!x.includes(o.st)),rl=SET.filter(s=>s.st==='released'),hd=SET.filter(s=>s.st!=='released');return{col:sum(live,o=>o.t+o.d),esc:sum(live.filter(o=>o.st!=='done'),o=>o.t)+sum(hd,s=>s.g),paid:BASE.paid+sum(rl,s=>s.g*s.k*(1-FEE)),com:BASE.com+sum(rl,s=>s.g*s.k*FEE),ref:sum(O.filter(o=>x.includes(o.st)),o=>o.t+o.d)+sum(rl,s=>s.g*(1-s.k))}};
function set(id,st,rd){const o=O.find(x=>x.id===id);o.st=st;if(rd)o.rd=rd;if(st==='done'&&!SET.find(s=>s.id===id))SET.unshift({id,b:o.b,g:o.t,k:1,left:parseInt(HOLD)||24,st:'held'});render()}
/* ---------- actions ---------- */
function add(i){const f=cart.find(c=>c.i===i);f?f.q++:cart.push({i,q:1});toast(PR[i].n+' added to your bag',0);render()}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);render()}
function place(){const g={};cart.forEach(c=>{const p=PR[c.i];(g[p.b]=g[p.b]||[]).push([p.n,c.q,p.p])});
 Object.keys(g).forEach(b=>{O.unshift({id:'ASO-'+(seq++),b,c:CUST,items:g[b],t:sum(g[b],x=>x[1]*x[2]),d:DL[dl][1],st:'new',rd:'',left:3600})});
 cart=[];tab.customer='ord';toast('Order placed. The brand has 60 minutes to respond.');render()}
function acc(id,a){const o=O.find(x=>x.id===id);if(a){set(id,'packing');toast(id+' accepted by '+o.b)}else{set(id,'rejected');toast(id+' rejected by '+o.b+'. Customer refunded.')}}
function review(i,a){const x=AP.splice(i,1)[0];CNT[x.k][a?'a':'r']++;if(a){x.k==='brand'?BR.push({n:x.n,cat:x.cat,city:x.city,ord:0,rev:0,on:true}):RD.push({n:x.n,type:x.cat,city:x.city,del:0,on:true})}toast(x.n+(a?' approved. Welcome email sent.':' rejected. Reason sent to applicant.'));render()}
function apply(k){const n=$('an').value.trim();if(!n){$('an').focus();return}if(!$('at').checked){toast('Accept the onboarding terms to continue.',0);return}
 AP.unshift({k,n:esc(n),cat:$('ac').value,city:$('ay').value,when:'Just now'});toast('Application sent. Admin reviews within 48 hours.');tab[RL]=k==='brand'?'ord':'jobs';render()}
function addTerm(){const v=$('nt').value.trim();if(!v)return;TERMS.push(esc(v));TV++;toast('Term added. Terms are now version '+TV+'.');render()}
const dis=(l,i)=>{l[i].on=!l[i].on;toast(l[i].n+(l[i].on?' reinstated':' suspended'));render()};
/* ---------- views ---------- */
const join=k=>`<h1>${k==='brand'?'Sell on Aso':'Deliver with Aso'}</h1><p class="sub">Applications go to the admin team. Read the terms below first.</p><div class="card" style="margin-top:18px"><h2>Onboarding terms · v${TV}</h2>${TERMS.map(t=>`<div class="row"><span>${t}</span></div>`).join('')}
 <label>${k==='brand'?'Brand name':'Fleet or rider name'}<input type="text" id="an"></label><label>${k==='brand'?'Category':'Type'}<select id="ac">${(k==='brand'?['Women’s wear','Men’s wear','Native wear','Streetwear','Shoes','Accessories']:['Independent rider','Fleet · 5–10 riders','Fleet · 10+ riders']).map(x=>`<option>${x}</option>`).join('')}</select></label><label>City<select id="ay">${['Lagos','Abuja','Port Harcourt','Awka','Ibadan'].map(x=>`<option>${x}</option>`).join('')}</select></label>
 <label class="ck"><input type="checkbox" id="at"><span style="font-weight:500;color:var(--ink)">I have read and accept the onboarding terms.</span></label><div style="margin-top:16px"><button class="btn ac" onclick="apply('${k}')">Submit application</button></div></div>`;
const V={
customer:{
 shop:()=>`<h1>Ready-to-wear, delivered.</h1><p class="sub">Nigerian brands, at your door in hours.</p><div class="grid">${PR.filter(p=>BR.find(b=>b.n===p.b&&b.on)).map(p=>`<div class="pc ${p.out?'out':''}"><div class="pic">${p.n[0]}</div><b>${p.n}</b><div class="sub" style="margin:0">${p.b}</div><div class="row" style="border:0;padding-bottom:0"><b>${N(p.p)}</b><button class="btn s" ${p.out?'disabled':''} onclick="add(${p.id})">${p.out?'Sold out':'Add to bag'}</button></div></div>`).join('')}</div>`,
 bag:()=>{if(!cart.length)return`<h1>Your bag</h1><p class="sub" style="margin-top:14px">Your bag is empty. Add something from the shop.</p><div style="margin-top:14px"><button class="btn" onclick="tab.customer='shop';render()">Browse the shop</button></div>`;
  const s=sum(cart,c=>PR[c.i].p*c.q),brands=new Set(cart.map(c=>PR[c.i].b)).size,fee=DL[dl][1]*brands;
  return`<h1>Your bag</h1><div class="card" style="margin-top:18px">${cart.map((c,i)=>`<div class="row"><span><b>${PR[c.i].n}</b><br><span class="sub">${PR[c.i].b}</span></span><span style="display:flex;gap:10px;align-items:center"><button class="btn ghost s" onclick="qty(${i},-1)" aria-label="Fewer">−</button>${c.q}<button class="btn ghost s" onclick="qty(${i},1)" aria-label="More">+</button><b style="min-width:90px;text-align:right">${N(PR[c.i].p*c.q)}</b></span></div>`).join('')}</div>
  <div class="card"><h2>Delivery speed</h2><div class="chips">${DL.map((d,i)=>`<button class="chip ${i===dl?'sel':''}" onclick="dl=${i};render()">${d[0]} · ${N(d[1])}</button>`).join('')}</div><p class="sub">Delivery is charged once per brand, since each brand ships separately.</p></div>
  <div class="card"><div class="row"><span>Items</span><span>${N(s)}</span></div><div class="row"><span>Delivery (${brands} brand${brands>1?'s':''})</span><span>${N(fee)}</span></div><div class="row"><b>Total</b><b>${N(s+fee)}</b></div><button class="btn ac" style="margin-top:8px" onclick="place()">Pay ${N(s+fee)}</button></div>`},
 ord:()=>{const L=O.filter(o=>o.c===CUST);return`<h1>My orders</h1><p class="sub">Track every order from the brand to your door.</p><div style="margin-top:18px">${L.length?L.map(o=>`<div class="card"><div class="row" style="border:0;padding:0"><span><b>${o.id}</b> <span class="sub">${o.b}</span></span>${pill(o.st)}</div>${o.items.map(i=>`<div class="sub">${i[1]}× ${i[0]}</div>`).join('')}${prog(o)}<div class="sub">${N(o.t+o.d)} paid${o.pt?' · '+o.pt:''}${o.rd?' · Rider: '+o.rd:''}</div>${(s=>s&&s.st==='held'?`<div class="sub" style="margin-top:10px">Something wrong? Report a problem:</div><div class="chips">${['Wrong size','Not as pictured','Wrong colour'].map(r=>`<button class="chip" onclick="rep('${o.id}','${r}')">${r}</button>`).join('')}</div>`:s&&s.st==='frozen'?'<span class="pill y" style="margin-top:10px">Problem reported. Under review.</span>':'')(SET.find(s=>s.id===o.id))}</div>`).join(''):'<p class="sub">No orders yet. Place one from the shop.</p>'}</div>`}},
vendor:{
 ord:()=>{const L=O.filter(o=>o.b===me);return`<div class="row" style="border:0;padding:0"><div><h1>Orders</h1><p class="sub">Accept or reject within 60 minutes. Unanswered orders cancel automatically.</p></div><select id="vs" style="width:auto" onchange="me=this.value;render()">${BR.filter(b=>b.on).map(b=>`<option ${b.n===me?'selected':''}>${b.n}</option>`).join('')}</select></div>
  <div class="stats">${stat('Waiting for you',L.filter(o=>o.st==='new').length)}${stat('In progress',L.filter(o=>['packing','ready','transit'].includes(o.st)).length)}${stat('Delivered',L.filter(o=>o.st==='done').length)}${stat('Earned',N(sum(L.filter(o=>o.st==='done'))*(1-FEE)),'after '+FEE*100+'% fee')}</div>
  ${L.length?L.map(o=>`<div class="card"><div class="row" style="border:0;padding:0"><span><b>${o.id}</b> <span class="sub">${o.c}</span></span>${o.st==='new'?tm(o):pill(o.st)}</div>${o.items.map(i=>`<div class="row"><span>${i[1]}× ${i[0]}</span><span>${N(i[1]*i[2])}</span></div>`).join('')}<div class="row" style="border:0"><span class="sub">You receive ${N(o.t*(1-FEE))} · Aso fee ${N(o.t*FEE)}</span><span style="display:flex;gap:8px">${o.st==='new'?`<button class="btn s" onclick="acc('${o.id}',1)">Accept</button><button class="btn no s" onclick="acc('${o.id}',0)">Reject</button>`:o.st==='packing'?`<button class="btn ac s" onclick="ready('${o.id}')">Ready for pickup</button>`:''}</span></div></div>`).join(''):'<p class="sub">No orders for this brand yet.</p>'}`},
 inv:()=>`<h1>Inventory</h1><p class="sub">Mark a product out of stock to hide it from customers.</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><input type="text" id="pn" placeholder="New product name" style="width:220px;margin:0"><input type="text" id="pp" value="25000" aria-label="Price in naira" style="width:110px;margin:0"><button class="btn ac" onclick="addP()">Add product</button></div><div style="margin-top:18px">${PR.filter(p=>p.b===me).map(p=>`<div class="card"><div class="row" style="border:0;padding:0"><span><b>${p.n}</b><br><span class="sub">${N(p.p)}</span></span><button class="btn ${p.out?'':'ghost'} s" onclick="PR[${p.id}].out=!PR[${p.id}].out;toast('${p.n} '+(PR[${p.id}].out?'hidden from customers':'back in stock'));render()">${p.out?'Back in stock':'Mark out of stock'}</button></div></div>`).join('')||'<p class="sub">No products yet.</p>'}</div>`,
 pay:()=>{const L=O.filter(o=>o.b===me),d=sum(L.filter(o=>o.st==='done')),p=sum(L.filter(o=>['packing','ready','transit'].includes(o.st)));return`<h1>Payouts</h1><p class="sub">Each order splits automatically after delivery: ${(1-FEE)*100}% to you, ${FEE*100}% to Aso. Payouts release after a ${HOLD} hold.</p><div class="stats">${stat('Paid out',N(d*(1-FEE)))}${stat('Pending delivery',N(p*(1-FEE)))}${stat('Aso fees',N(d*FEE))}</div><div class="card"><h2>History</h2>${L.filter(o=>o.st!=='new'&&o.st!=='rejected').map(o=>`<div class="row"><span><b>${o.id}</b><br><span class="sub">${ST[o.st][0]}</span></span><span style="text-align:right"><b>${N(o.t*(1-FEE))}</b><br><span class="sub">of ${N(o.t)}</span></span></div>`).join('')||'<p class="sub">Nothing yet.</p>'}</div>`},
 join:()=>join('brand')},
dispatch:{
 jobs:()=>{const Q=O.filter(o=>o.st==='ready'),A=O.filter(o=>o.st==='transit'&&o.rd===rider);return`<h1>Jobs</h1><p class="sub">Signed in as ${rider}. Pickups appear when a brand taps Ready for pickup.</p>
  <div class="card" style="margin-top:18px"><h2>Open pickups (${Q.length})</h2>${Q.map(o=>`<div class="row"><span><b>${o.id}</b> <span class="sub">${o.b} → ${o.c}</span></span><span style="display:flex;gap:10px;align-items:center"><b>${N(o.d*.9)}</b><button class="btn ac s" onclick="set('${o.id}','transit','${rider}');toast('${o.id} picked up by ${rider}')">Accept pickup</button></span></div>`).join('')||'<p class="sub">No open pickups.</p>'}</div>
  <div class="card"><h2>On the road (${A.length})</h2>${A.map(o=>`<div class="row"><span><b>${o.id}</b> <span class="sub">${o.b} → ${o.c}</span></span><button class="btn s" onclick="set('${o.id}','done');toast('${o.id} delivered. Payout hold started.')">Mark delivered</button></div>`).join('')||'<p class="sub">Nothing in transit.</p>'}</div>`},
 earn:()=>{const D=O.filter(o=>o.rd===rider&&o.st==='done'),r=RD.find(x=>x.n===rider);return`<h1>Earnings</h1><p class="sub">Riders keep 90% of each delivery fee.</p><div class="stats">${stat('Deliveries',r.del+D.length,'all time')}${stat('This session',D.length)}${stat('Earned this session',N(sum(D,o=>o.d)*.9))}</div>`},
 join:()=>join('dispatch')},
admin:{
 ov:()=>{const m=money(),d0=O.filter(o=>o.st==='done').length,n0=O.length-d0,h=[...H,['Today',d0,n0]],mx=Math.max(...h.map(x=>x[1]+x[2]));
  return`<h1>Overview</h1><p class="sub">Balances, orders and onboarding across every portal, updated live.</p>
  <div class="stats">${stat('Collected from customers',N(m.col+BASE.paid*1.1))}${stat('Held in escrow',N(m.esc),'awaiting delivery')}${stat('Paid out to brands',N(m.paid))}${stat('Platform commission',N(m.com),FEE*100+'% rate')}${stat('Refunded',N(m.ref))}</div>
  <div class="stats">${stat('Orders today',O.length)}${stat('Delivered',d0)}${stat('Not delivered',n0,'in progress or cancelled')}${stat('Brands',BR.filter(b=>b.on).length,AP.filter(a=>a.k==='brand').length+' requests')}${stat('Dispatch partners',RD.filter(r=>r.on).length,AP.filter(a=>a.k==='dispatch').length+' requests')}</div>
  <div class="two"><div class="card"><h2>Orders per day</h2><div class="chart">${h.map(x=>{const t=x[1]+x[2];return`<div class="col"><em>${x[1]}/${t}</em><div class="stk" style="height:${t/mx*120}px"><i class="nd" style="height:${x[2]/t*100}%"></i><i class="dl"></i></div><small>${x[0]}</small></div>`}).join('')}</div><div class="key"><span><i style="background:var(--ink)"></i>Delivered</span><span><i style="background:var(--ac)"></i>Not delivered</span></div></div>
  <div class="card"><h2>Onboarding decisions</h2>${['brand','dispatch'].map(k=>`<div class="row"><span>${k==='brand'?'Brands':'Dispatch'}</span><span><span class="pill g">${CNT[k].a} accepted</span> <span class="pill r">${CNT[k].r} rejected</span> <span class="pill y">${AP.filter(a=>a.k===k).length} pending</span></span></div>`).join('')}<div class="row"><span>Latest activity</span><span class="sub">${O[0].id} · ${ST[O[0].st][0]}</span></div></div></div>`},
 ven:()=>`<h1>Brands</h1><p class="sub">Performance and status of every vendor.</p><div class="card sc" style="margin-top:18px"><table><tr><th>Brand</th><th>Category</th><th>City</th><th>Orders</th><th>Revenue</th><th>Status</th><th></th></tr>${BR.map((b,i)=>{const L=O.filter(o=>o.b===b.n);return`<tr><td><b>${b.n}</b></td><td>${b.cat}</td><td>${b.city}</td><td>${b.ord+L.length}</td><td>${N(b.rev+sum(L.filter(o=>o.st==='done')))}</td><td><span class="pill ${b.on?'g':'r'}">${b.on?'Active':'Suspended'}</span></td><td><button class="btn ghost s" onclick="dis(BR,${i})">${b.on?'Suspend':'Reinstate'}</button></td></tr>`}).join('')}</table></div>`,
 dis:()=>`<h1>Dispatch partners</h1><p class="sub">Riders and fleets delivering for Aso.</p><div class="card sc" style="margin-top:18px"><table><tr><th>Partner</th><th>Type</th><th>City</th><th>Deliveries</th><th>Status</th><th></th></tr>${RD.map((r,i)=>`<tr><td><b>${r.n}</b></td><td>${r.type}</td><td>${r.city}</td><td>${r.del+O.filter(o=>o.rd===r.n&&o.st==='done').length}</td><td><span class="pill ${r.on?'g':'r'}">${r.on?'Active':'Suspended'}</span></td><td><button class="btn ghost s" onclick="dis(RD,${i})">${r.on?'Suspend':'Reinstate'}</button></td></tr>`).join('')}</table></div>${pp()}`,
 onb:()=>`<h1>Onboarding</h1><p class="sub">Review requests and manage the terms every new brand and rider must accept.</p><div class="stats">${stat('Brand requests',AP.filter(a=>a.k==='brand').length,CNT.brand.a+' accepted · '+CNT.brand.r+' rejected')}${stat('Dispatch requests',AP.filter(a=>a.k==='dispatch').length,CNT.dispatch.a+' accepted · '+CNT.dispatch.r+' rejected')}</div>
  <div class="card"><h2>Pending requests</h2>${AP.map((a,i)=>`<div class="row"><span><b>${a.n}</b> <span class="pill">${a.k==='brand'?'Brand':'Dispatch'}</span><br><span class="sub">${a.cat} · ${a.city} · ${a.when}</span></span><span style="display:flex;gap:8px"><button class="btn s" onclick="review(${i},1)">Accept</button><button class="btn no s" onclick="review(${i},0)">Reject</button></span></div>`).join('')||'<p class="sub">No pending requests.</p>'}</div>
  <div class="card"><h2>Onboarding terms · v${TV}</h2>${TERMS.map(t=>`<div class="row"><span>${t}</span></div>`).join('')}<label>Add a term<input type="text" id="nt" placeholder="e.g. Brands must keep stock levels accurate"></label><div style="margin-top:10px"><button class="btn" onclick="addTerm()">Publish new version</button></div></div>`,
 stl:()=>`<h1>Settlements</h1><p class="sub">Brand payouts are held after delivery. If a customer reports a problem, the payout freezes until you resolve it.</p><div class="stats">${stat('Held',SET.filter(s=>s.st==='held').length)}${stat('Disputes open',SET.filter(s=>s.st==='frozen').length)}${stat('Released',SET.filter(s=>s.st==='released').length)}</div><div class="row" style="border:0"><span class="sub">Hold policy: ${HOLD}</span><button class="btn ghost s" onclick="ff()">Fast-forward 12 hours</button></div>${SET.map((s,i)=>`<div class="card"><div class="row" style="border:0;padding:0"><span><b>${s.id}</b> <span class="sub">${s.b} · ${N(s.g)}</span></span><span class="pill ${s.st==='frozen'?'r':s.st==='held'?'y':'g'}">${s.st==='frozen'?'Frozen · dispute':s.st==='held'?'Held · '+s.left+'h left':s.k===1?'Released':s.k===0?'Refunded':'Split'}</span></div>${s.st==='frozen'?`<p class="sub">${s.who||'Customer'}: ${s.note}</p><div class="chips"><button class="btn ghost s" onclick="res(${i},0)">Full refund</button><button class="btn ghost s" onclick="res(${i},.5)">Partial refund 50%</button><button class="btn s" onclick="res(${i},1)">Pay brand in full</button></div>`:s.st==='held'?`<div style="margin-top:8px"><button class="btn ghost s" onclick="res(${i},1,1)">Release early</button></div>`:`<p class="sub">Brand paid ${N(s.g*s.k*(1-FEE))} · customer refunded ${N(s.g*(1-s.k))}</p>`}</div>`).join('')}`,
 set:()=>`<h1>Settings</h1><p class="sub">Platform rules and the audit trail.</p><div class="card" style="margin-top:18px"><div class="row"><span>Commission rate</span><span class="chips" style="margin:0">${[.1,.15,.2].map(r=>`<button class="chip ${r===FEE?'sel':''}" onclick="FEE=${r};toast('Commission set to ${r*100}%');render()">${r*100}%</button>`).join('')}</span></div><div class="row"><span>Payout hold</span><span class="chips" style="margin:0">${['24 hours','48 hours','T+1'].map(h=>`<button class="chip ${h===HOLD?'sel':''}" onclick="HOLD='${h}';toast('Payout hold set to ${h}');render()">${h}</button>`).join('')}</span></div><div class="row"><span>Brand response window</span><b>60 minutes</b></div></div>
  <div class="card"><h2>Audit log</h2>${LOG.slice(0,12).map(l=>`<div class="row"><span>${l[1]}</span><span class="sub">${l[0]}</span></div>`).join('')||'<p class="sub">Actions across all portals will appear here.</p>'}</div>`}};
setInterval(()=>{let ch=false;O.forEach(o=>{if(o.st==='new'){o.left--;if(o.left<=0){o.st='cancel';ch=true;toast(o.id+' expired. '+o.b+' didn’t respond in 60 minutes. Customer refunded.')}}});if(ch)render();else document.querySelectorAll('[data-tm]').forEach(e=>{const o=O.find(x=>x.id===e.dataset.tm);if(o){e.textContent=fm(o.left)+' left';e.className='pill '+(o.left<600?'r':'y')}})},1000);
render();
</script>
