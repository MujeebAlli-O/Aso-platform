<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aso Admin – control centre</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2F9;--card:#fff;--ink:#1B1F4B;--ink2:#5F6488;--line:#E1E3EF;--soft:#F4F5FB;--blue:#2B3BCB;--sun:#F5B700;--red:#D6402F;--green:#14866D;--side:#12142E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1022;--card:#181B38;--ink:#E6E8FA;--ink2:#9EA3CB;--line:#2A2E55;--soft:#20244A;--side:#080916;--blue:#7C89FF}}
:root[data-theme="dark"]{--bg:#0E1022;--card:#181B38;--ink:#E6E8FA;--ink2:#9EA3CB;--line:#2A2E55;--soft:#20244A;--side:#080916;--blue:#7C89FF}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}h2{font-size:17px;font-weight:800;margin-bottom:10px}
.sub{color:var(--ink2);font-size:13.5px;line-height:1.4;margin-top:4px}
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:800;background:var(--ink);color:var(--bg);font-size:14px}.btn.sun{background:var(--sun);color:#1B1F4B}.btn.ok{background:var(--green);color:#fff}.btn.no{background:transparent;border:1.5px solid var(--red);color:var(--red)}.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}
aside{background:var(--side);color:#fff;width:224px;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:22px;padding:0 8px 14px}.logo i{font-style:normal;background:var(--sun);color:#1B1F4B;border-radius:8px;padding:0 7px;margin-right:6px}.logo small{display:block;font-size:12px;font-weight:600;color:#A9AEDB;margin-top:4px}
.nav{background:none;border:0;color:#C5C9EE;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between}.nav.on{background:rgba(255,255,255,.12);color:#fff}.nav b{background:var(--red);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
main{margin-left:224px;padding:26px 28px 50px;max-width:1080px}
.head{margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat small{color:var(--ink2)}.stat div{font-size:24px;font-weight:800;margin-top:3px}.stat span{font-size:12px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}.row:last-child{border:0}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--soft);white-space:nowrap}.pill.g{background:#D8F1EA;color:#0E6A56}.pill.r{background:#FBE3DF;color:var(--red)}.pill.y{background:#FDF0C4;color:#7A5A00}.pill.b{background:#E0E4FF;color:#2B3BCB}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px}.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:10px}.chart div{flex:1;background:var(--blue);border-radius:8px 8px 0 0;position:relative;min-height:6px}.chart div.t{background:var(--sun)}.chart small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--ink2);font-size:11px}.chart em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;font-weight:700}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;display:flex;margin:8px 0}.bar i{display:block;height:100%}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#FDF0C4;color:#5C4400;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-weight:600;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px;text-align:left;font-weight:700}.opt small{display:block;font-weight:400;color:var(--ink2);margin-top:3px}.opt.sel{border-color:var(--blue);background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--ink2);font-weight:600;padding:8px 6px}td{padding:10px 6px;border-top:1px solid var(--line)}.sc{overflow-x:auto}
.chk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:14px;font-weight:600;transform:translateY(-150%);transition:transform .3s;z-index:30;max-width:330px}#toast.on{transform:none}
dialog{border:0;border-radius:20px;padding:24px;max-width:500px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(10,12,40,.5)}
@media(max-width:820px){aside{top:auto;width:100%;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;justify-content:space-around;overflow-x:auto}.logo{display:none}.nav{flex-direction:column;font-size:11px;padding:8px 8px;align-items:center;gap:2px}main{margin:0;padding:18px 14px 100px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<aside>
 <div class="logo"><i>A</i>Aso<small>Admin · Super admin</small></div>
 <button class="nav on" data-t="ov">Overview</button><button class="nav" data-t="ord">Orders</button><button class="nav" data-t="pay">Payments</button><button class="nav" data-t="set">Settlements <b id="nd">0</b></button><button class="nav" data-t="br">Brands <b id="nb">0</b></button><button class="nav" data-t="dp">Dispatch <b id="np">0</b></button><button class="nav" data-t="cfg">Team &amp; settings</button>
</aside>
<main><div class="head"><h1 id="title"></h1><p class="sub" id="tsub"></p></div><div id="view"></div></main>
<div id="toast" role="status"></div><dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id);const N=n=>'₦'+Math.round(n).toLocaleString('en-NG');
let FEE=.2,pol='24h',tab='ov',ofil='all',hours=0,ver='';
const POL={'24h':['Hold 24 hours','Release one day after delivery confirmation.',24],'48h':['Hold 48 hours','For new or high-risk brands.',48],'t1':['T+1 after confirmation','Next business day after customer code.',24]};
const O=[
['ASO-20491','Mazelle','Ada O.','Lekki',28000,2500,'Card','await','–',4],['ASO-20490','Oga & Co','Tunde B.','Yaba',41500,1800,'Transfer','pack','–',11],['ASO-20489','Kara Kicks','Ngozi E.','Ikoyi',18500,2400,'Card','rider','Chowdeck Relay',16],['ASO-20488','Lagos Lore','Femi A.','VI',45000,2100,'Card','transit','Gokada',22],['ASO-20487','Mazelle','Chiamaka N.','Ikeja',36500,2600,'Transfer','transit','Kwik',27],
['ASO-20486','Mazelle','Bola K.','Surulere',19500,1800,'Pay on delivery','done','Sendbox',60],['ASO-20485','Oga & Co','Ife O.','Lekki',22000,2400,'Card','done','Chowdeck Relay',75],['ASO-20484','Zuri Atelier','Kemi D.','Ikoyi',62000,2100,'Card','done','Gokada',90],['ASO-20483','Kara Kicks','Sola M.','Yaba',18500,2600,'Transfer','done','Kwik',110],['ASO-20482','Lagos Lore','Ken I.','VI',45000,2100,'Card','done','Gokada',130],
['ASO-20481','Mazelle','Ada O.','Lekki',56000,2400,'Card','done','Chowdeck Relay',150],['ASO-20480','Oga & Co','Dayo T.','Ikeja',22000,0,'Card','cancel','–',170],['ASO-20479','Mazelle','Uche P.','Yaba',28000,0,'Transfer','cancel','–',200]].map(a=>({id:a[0],b:a[1],c:a[2],z:a[3],t:a[4],d:a[5],m:a[6],st:a[7],p:a[8],ago:a[9]}));
const ST={await:['Awaiting brand','y'],pack:['Packing','y'],rider:['Rider assigned','b'],transit:['In transit','b'],done:['Completed','g'],cancel:['Cancelled','r']};
const ONG=['await','pack','rider','transit'];
let S=[{id:'ASO-20486',v:'Mazelle',g:19500,left:30,st:'held'},{id:'ASO-20485',v:'Oga & Co',g:22000,left:6,st:'held'},{id:'ASO-20484',v:'Zuri Atelier',g:62000,left:41,st:'held'},{id:'ASO-20483',v:'Kara Kicks',g:18500,left:20,st:'frozen',open:true,note:'Customer ordered size 42 but received size 40.',who:'Customer, Yaba'},{id:'ASO-20450',v:'Mazelle',g:64500,left:0,st:'released'}];
let BR=[['Mazelle','Women’s wear','Lagos',4.8,1.2,'active'],['Oga & Co','Men’s wear','Lagos',4.6,0.8,'active'],['Kara Kicks','Shoes','Lagos',4.4,3.4,'active'],['Lagos Lore','Streetwear','Lagos',4.1,6.1,'active'],['Zuri Atelier','Native / Agbada','Abuja',4.7,0.5,'active']];
let APP=[{n:'Threadhouse',cat:'Women’s wear',city:'Lagos',docs:{'CAC certificate':true,'Director ID':true,'Bank account name match':false,'Pickup address visit':false},who:'Applied 2 days ago · 14 products'},{n:'Nene Kicks',cat:'Shoes',city:'Port Harcourt',docs:{'CAC certificate':true,'Director ID':true,'Bank account name match':true,'Pickup address visit':true},who:'Applied today · 22 products'},{n:'Ọba Native',cat:'Native / Agbada',city:'Awka',docs:{'CAC certificate':false,'Director ID':true,'Bank account name match':true,'Pickup address visit':false},who:'Applied 4 days ago · 9 products'}];
let PR=[['Chowdeck Relay','API','9.1 min','97%',1],['Gokada','API','12.4 min','94%',1],['Kwik','API','7.8 min','95%',1],['Sendbox','API','17.5 min','91%',1]];
let RA=[{n:'Lagos Riders Co-op',cat:'Fleet · 18 riders',city:'Lagos',docs:{'Business registration':true,'Rider licences':true,'Vehicle papers':true,'Guarantor forms':false},who:'Applied 1 day ago'},{n:'Samuel Eze',cat:'Independent rider',city:'Awka',docs:{'Business registration':true,'Rider licences':true,'Vehicle papers':true,'Guarantor forms':true},who:'Applied today'}];
let AUD=[['Super admin','Logged in']];
const aud=m=>AUD.unshift(['Super admin',m]);
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===b));render()});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3800);aud(m)}
const ongoing=()=>O.filter(o=>ONG.includes(o.st)),done=()=>O.filter(o=>o.st==='done'),canc=()=>O.filter(o=>o.st==='cancel');
const live=()=>O.filter(o=>o.st!=='cancel');
function render(){$('nd').textContent=S.filter(x=>x.open).length;$('nb').textContent=APP.length;$('np').textContent=RA.length;({ov:rOv,ord:rOrd,pay:rPay,set:rSet,br:rBr,dp:rDp,cfg:rCfg})[tab]()}
function T(t,s){$('title').textContent=t;$('tsub').textContent=s}
function rOv(){T('Overview','Everything happening on Aso right now.');
 const gmv=live().reduce((a,o)=>a+o.t,0),pend=APP.length+RA.length,openD=S.filter(x=>x.open).length;const exp=O.filter(o=>o.st==='await').length;
 const wk=[...WK,O.length*4],mx=Math.max(...wk);
 $('view').innerHTML=`${pend?`<div class="alert"><span>${APP.length} brand and ${RA.length} dispatch applications waiting for review</span><button class="btn" onclick="go('br')">Review</button></div>`:''}${openD?`<div class="alert"><span>${openD} open dispute: vendor payout frozen</span><button class="btn" onclick="go('set')">Resolve</button></div>`:''}${exp?`<div class="alert"><span>${exp} order waiting on a brand’s 60-minute response</span><button class="btn" onclick="go('ord')">View</button></div>`:''}
 <div class="stats"><div class="stat"><small>Active brands</small><div>${BR.filter(b=>b[5]==='active').length}</div><span>${APP.length} pending</span></div><div class="stat"><small>Dispatch partners</small><div>${PR.filter(p=>p[4]).length}</div><span>${RA.length} pending</span></div><div class="stat"><small>Total orders today</small><div>${O.length}</div></div><div class="stat"><small>Ongoing</small><div>${ongoing().length}</div></div><div class="stat"><small>Completed</small><div>${done().length}</div></div><div class="stat"><small>Cancelled</small><div>${canc().length}</div></div><div class="stat"><small>Sales (GMV)</small><div>${N(gmv)}</div></div><div class="stat"><small>Aso commission</small><div>${N(gmv*FEE)}</div><span>${FEE*100}% rate</span></div></div>
 <div class="two"><div class="card"><h2>Orders, last 7 days</h2><div class="chart" style="margin-bottom:26px">${wk.map((v,i)=>`<div class="${i===6?'t':''}" style="height:${v/mx*100}%"><em>${v}</em><small>${i===6?'Today':'D-'+(6-i)}</small></div>`).join('')}</div></div>
 <div class="card"><h2>Live activity</h2>${O.slice(0,5).map(o=>`<div class="row"><span><b>${o.id}</b> <span class="sub">${o.b} → ${o.z}</span></span><span class="pill ${ST[o.st][1]}">${ST[o.st][0]}</span></div>`).join('')}</div></div>`}
function go(t){document.querySelector(`[data-t="${t}"]`).click()}
function rOrd(){T('Orders','Every order across all brands. Admin can see everything, not edit brand stock.');
 const f=[['all','All'],['ong','Ongoing'],['done','Completed'],['cancel','Cancelled']],L=O.filter(o=>ofil==='all'||(ofil==='ong'&&ONG.includes(o.st))||o.st===ofil);
 $('view').innerHTML=`<div class="chips">${f.map(x=>`<button class="chip ${x[0]===ofil?'sel':''}" onclick="ofil='${x[0]}';rOrd()">${x[1]}</button>`).join('')}</div><div class="card sc"><table><tr><th>Order</th><th>Brand</th><th>Customer</th><th>Area</th><th>Total</th><th>Dispatch</th><th>Status</th></tr>${L.map(o=>`<tr><td><b>${o.id}</b><br><span class="sub">${o.ago} min ago</span></td><td>${o.b}</td><td>${o.c}</td><td>${o.z}</td><td>${N(o.t+o.d)}</td><td>${o.p}</td><td><span class="pill ${ST[o.st][1]}">${ST[o.st][0]}</span></td></tr>`).join('')}</table></div>`}
function rPay(){T('Payments','Money in, money held, money out.');
 const col=live().reduce((a,o)=>a+o.t,0),del=live().reduce((a,o)=>a+o.d,0),refd=canc().reduce((a,o)=>a+o.t,0);
 const held=S.filter(x=>['held','frozen'].includes(x.st)).reduce((a,x)=>a+x.g*(1-FEE),0),paid=S.filter(x=>x.st==='released').reduce((a,x)=>a+x.g*(1-FEE),0);
 const m={};live().forEach(o=>m[o.m]=(m[o.m]||0)+o.t+o.d);const tm=Object.values(m).reduce((a,b)=>a+b,0),cols=['var(--blue)','var(--sun)','var(--green)'];
 $('view').innerHTML=`<div class="stats"><div class="stat"><small>Collected from customers</small><div>${N(col+del)}</div></div><div class="stat"><small>Held in escrow</small><div>${N(held)}</div><span>Awaiting release</span></div><div class="stat"><small>Paid out to brands</small><div>${N(paid)}</div></div><div class="stat"><small>Aso commission</small><div>${N(col*FEE)}</div></div><div class="stat"><small>Delivery fees to partners</small><div>${N(del)}</div></div><div class="stat"><small>Refunded</small><div>${N(refd)}</div></div></div>
 <div class="two"><div class="card"><h2>Payment methods</h2><div class="bar">${Object.keys(m).map((k,i)=>`<i style="width:${m[k]/tm*100}%;background:${cols[i%3]}"></i>`).join('')}</div>${Object.keys(m).map((k,i)=>`<div class="row"><span><span style="color:${cols[i%3]}">●</span> ${k}</span><b>${Math.round(m[k]/tm*100)}% · ${N(m[k])}</b></div>`).join('')}</div>
 <div class="card"><h2>Where each ₦10,000 goes</h2><div class="row"><span>Brand payout</span><b>${N(10000*(1-FEE))}</b></div><div class="row"><span>Aso commission</span><b>${N(10000*FEE)}</b></div><p class="sub">Delivery fee is charged on top and passed to the delivery partner.</p></div></div>
 <div class="card sc" style="margin-top:14px"><h2>Recent transactions</h2><table><tr><th>Ref</th><th>Method</th><th>Amount</th><th>Status</th></tr>${O.slice(0,8).map(o=>`<tr><td>${o.id}</td><td>${o.m}</td><td>${N(o.t+o.d)}</td><td><span class="pill ${o.st==='cancel'?'r':o.m==='Pay on delivery'&&o.st!=='done'?'y':'g'}">${o.st==='cancel'?'Refunded':o.m==='Pay on delivery'&&o.st!=='done'?'Pending':'Paid'}</span></td></tr>`).join('')}</table></div>`}
function ff(){S.forEach(x=>{if(x.st==='held'){x.left-=12;if(x.left<=0){x.left=0;x.st='released';}}});hours+=12;toast('12 hours passed. Due payouts released.');render()}
function rSet(){T('Settlements','Policy: '+POL[pol][0]+'. Demo time elapsed: '+hours+'h.');
 $('view').innerHTML=`<div class="card"><h2>Settlement policy</h2><div class="opts">${Object.keys(POL).map(k=>`<button class="opt ${k===pol?'sel':''}" onclick="pol='${k}';toast('Policy set: ${POL[k][0]}');rSet()">${POL[k][0]}<small>${POL[k][1]}</small></button>`).join('')}</div><div style="margin-top:12px"><button class="btn sun" onclick="ff()">Fast-forward 12 hours</button></div></div>`+S.map(x=>`<div class="card"><div class="row" style="border:0;padding:0"><span><b>${x.id}</b> <span class="sub">· ${x.v}</span></span><span class="pill ${{held:'y',frozen:'r',released:'g',refunded:'r'}[x.st]}">${{held:'Held · '+x.left+'h left',frozen:'Frozen · dispute',released:'Released',refunded:'Refunded'}[x.st]}</span></div><div class="row"><span>Total ${N(x.g)}</span><span>Brand ${N(x.st==='refunded'?0:x.g*(1-FEE))} · Aso ${N(x.st==='refunded'?0:x.g*FEE)}</span></div>${x.open?`<div class="sub" style="background:var(--soft);padding:10px;border-radius:10px;margin:6px 0 10px"><b>${x.who}:</b> ${x.note}<br>📷 Customer photo · 📷 Brand packing photo · 🛵 Rider handover log</div><button class="btn" onclick="resolve('${x.id}')">Resolve dispute</button>`:''}${x.st==='held'?`<button class="btn ok" onclick="rel('${x.id}')">Release now</button> <button class="btn no" onclick="flag('${x.id}')">Flag wrong item</button>`:''}</div>`).join('')}
function rel(id){const x=S.find(s=>s.id===id);x.st='released';toast(N(x.g*(1-FEE))+' released to '+x.v);rSet()}
function flag(id){const x=S.find(s=>s.id===id);x.st='frozen';x.open=true;x.who='Customer';x.note='Item delivered does not match the order.';toast('Payout frozen for '+id);rSet()}
function resolve(id){const x=S.find(s=>s.id===id);$('dlg').innerHTML=`<h2>Resolve ${id}</h2><div class="opts" style="grid-template-columns:1fr"><button class="opt" onclick="done('${id}','f')">Refund customer in full<small>Customer gets ${N(x.g)}. Brand gets ₦0 and collects the item.</small></button><button class="opt" onclick="done('${id}','h')">Partial refund (50%)<small>Brand receives ${N(x.g*(1-FEE)/2)}.</small></button><button class="opt" onclick="done('${id}','r')">Rule for the brand<small>Release ${N(x.g*(1-FEE))}.</small></button></div><div style="margin-top:14px"><button class="btn ghost" onclick="$('dlg').close()">Cancel</button></div>`;$('dlg').showModal()}
function done(id,k){const x=S.find(s=>s.id===id);x.open=false;if(k==='f')x.st='refunded';if(k==='h'){x.st='released';x.g/=2}if(k==='r')x.st='released';$('dlg').close();toast('Dispute '+id+' resolved');rSet()}
function rBr(){T('Brands','Onboard, verify and monitor every brand.');
 $('view').innerHTML=`<div class="card"><h2>Applications (${APP.length})</h2>${APP.length?APP.map((a,i)=>`<div class="row"><span><b>${a.n}</b> <span class="sub">${a.cat} · ${a.city}<br>${a.who}</span></span><span><span class="pill ${Object.values(a.docs).every(Boolean)?'g':'y'}">${Object.values(a.docs).filter(Boolean).length}/4 verified</span> <button class="btn" onclick="review('APP',${i},'brand')">Review</button></span></div>`).join(''):'<p class="sub">No pending applications.</p>'}</div>
 <div class="card sc"><h2>Active brands</h2><table><tr><th>Brand</th><th>Category</th><th>Orders</th><th>Rating</th><th>Disputes</th><th></th></tr>${BR.map((b,i)=>`<tr><td><b>${b[0]}</b><br><span class="sub">${b[2]}</span></td><td>${b[1]}</td><td>${O.filter(o=>o.b===b[0]).length}</td><td>★ ${b[3]}</td><td><span class="pill ${b[4]>5?'r':'g'}">${b[4]}%</span></td><td><button class="btn ghost" onclick="BR[${i}][5]=BR[${i}][5]==='active'?'paused':'active';toast('${b[0]} '+(BR[${i}][5]==='active'?'reactivated':'paused')+'');rBr()">${b[5]==='active'?'Pause':'Resume'}</button></td></tr>`).join('')}</table></div>`}
function rDp(){T('Dispatch','Delivery partners, fleets and independent riders.');
 $('view').innerHTML=`<div class="card"><h2>Connected delivery partners</h2>${PR.map((p,i)=>`<div class="row"><span><b>${p[0]}</b> <span class="sub">${p[1]} · avg pickup ${p[2]} · ${p[3]} success</span></span><span class="pill ${p[4]?'g':''}">${p[4]?'Live':'Paused'}</span><button class="btn ghost" onclick="PR[${i}][4]=PR[${i}][4]?0:1;toast('${p[0]} '+(PR[${i}][4]?'resumed':'paused'));rDp()">${p[4]?'Pause':'Resume'}</button></div>`).join('')}<div style="margin-top:12px"><button class="btn sun" onclick="addPartner()">+ Connect new partner</button></div></div>
 <div class="card"><h2>Fleet and rider applications (${RA.length})</h2>${RA.length?RA.map((a,i)=>`<div class="row"><span><b>${a.n}</b> <span class="sub">${a.cat} · ${a.city}<br>${a.who}</span></span><span><span class="pill ${Object.values(a.docs).every(Boolean)?'g':'y'}">${Object.values(a.docs).filter(Boolean).length}/4 verified</span> <button class="btn" onclick="review('RA',${i},'dispatch')">Review</button></span></div>`).join(''):'<p class="sub">No pending applications.</p>'}</div>`}
function addPartner(){$('dlg').innerHTML=`<h2>Connect a delivery partner</h2><p class="sub">Paste the partner’s API credentials. Aso checks them with a test quote before going live.</p><input id="pk" value="Partner name" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin-top:12px"><input value="sk_live_••••••••••••" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px"><div style="margin-top:14px;display:flex;gap:8px"><button class="btn ghost" onclick="$('dlg').close()">Cancel</button><button class="btn sun" onclick="PR.push([$('pk').value,'API','–','–',1]);$('dlg').close();toast('Test quote passed. Partner is live.');rDp()">Test and connect</button></div>`;$('dlg').showModal()}
function review(k,i,kind){const a=(k==='APP'?APP:RA)[i];
 $('dlg').innerHTML=`<h2>${a.n}</h2><p class="sub">${a.cat} · ${a.city}</p><div>${Object.keys(a.docs).map(d=>`<div class="chk"><span>${d}</span><button class="chip ${a.docs[d]?'sel':''}" aria-pressed="${a.docs[d]}" onclick="tgl('${k}',${i},'${d}','${kind}')">${a.docs[d]?'Verified ✓':'Mark verified'}</button></div>`).join('')}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" ${Object.values(a.docs).every(Boolean)?'':'disabled'} onclick="appr('${k}',${i},'${kind}')">Approve and go live</button><button class="btn ghost" onclick="$('dlg').close();toast('Info request sent to ${a.n}')">Request info</button><button class="btn no" onclick="rejA('${k}',${i})">Reject</button></div>`;$('dlg').showModal()}
function tgl(k,i,d,kind){const a=(k==='APP'?APP:RA)[i];a.docs[d]=!a.docs[d];review(k,i,kind)}
function appr(k,i,kind){const L=k==='APP'?APP:RA,a=L.splice(i,1)[0];if(k==='APP')BR.push([a.n,a.cat,a.city,0,0,'active']);else PR.push([a.n,a.cat.split(' ·')[0],'–','–',1]);$('dlg').close();toast(a.n+' approved. Welcome email and login sent.');render()}
function rejA(k,i){const L=k==='APP'?APP:RA,a=L.splice(i,1)[0];$('dlg').close();toast(a.n+' rejected. Reason sent to applicant.');render()}
function rCfg(){T('Team & settings','Who can do what, platform rules and the audit trail.');
 const R=[['Super admin',1,1,1,1,1],['Finance',0,1,1,0,0],['Operations',1,0,0,1,1],['Support',1,0,0,0,0]],P=['View orders','View payments','Release / refund','Approve brands','Manage dispatch'];
 $('view').innerHTML=`<div class="card"><h2>Platform rules</h2><div class="row"><span>Commission rate</span><span class="chips" style="margin:0">${[.15,.2,.25].map(r=>`<button class="chip ${r===FEE?'sel':''}" onclick="FEE=${r};toast('Commission set to ${r*100}%');rCfg()">${r*100}%</button>`).join('')}</span></div><div class="row"><span>Brand accept/reject window</span><b>60 minutes, then auto-cancel</b></div><div class="row"><span>Settlement policy</span><b>${POL[pol][0]}</b></div></div>
 <div class="card sc"><h2>Roles and access</h2><table><tr><th>Role</th>${P.map(p=>`<th>${p}</th>`).join('')}</tr>${R.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td>${v?'✓':'–'}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><h2>Audit log</h2>${AUD.slice(0,10).map(a=>`<div class="row"><span>${a[1]}</span><span class="sub">${a[0]}</span></div>`).join('')}</div>`}
/* ---------- random data + live simulation ---------- */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pk=a=>a[rnd(0,a.length-1)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const POOL=shuf(['Kente Row','Lekan Atelier','Ankara Alley','Sade Threads','Bello Basics','Orile Denim','Eko Thread','Mowe Mode','Nkem Studio','Aduke Wear','Tiwa Tailors','Ijebu Knits','Dapo & Sons','Kano Cloth House','Yewande Label','Calabar Cuts','Ogun Looms','Maitama Mode','Oluwa Kicks','Ife Footwear','Ọpẹ Collective','Tosin Tees']);
const CATS={'Women’s wear':[15000,45000],'Men’s wear':[15000,60000],'Shoes':[12000,40000],'Streetwear':[18000,55000],'Native / Agbada':[30000,95000],'Accessories':[6000,25000]};
const CITY=['Lagos','Lagos','Lagos','Abuja','Port Harcourt','Awka','Ibadan'],AREA=['Lekki','Yaba','Ikoyi','VI','Ikeja','Surulere','Ajah','Maryland','Gbagada'];
const FN=['Ada','Tunde','Ngozi','Femi','Chiamaka','Bola','Ife','Kemi','Sola','Ken','Dayo','Uche','Zainab','Emeka','Amaka','Tobi','Hauwa','Seyi'],LN=['O.','B.','E.','A.','N.','K.','D.','P.','I.','T.'];
const PN=()=>PR.filter(p=>p[4]).map(p=>p[0]);
const WK=[1,2,3,4,5,6].map(()=>rnd(40,95));
const mkBrand=n=>[n,pk(Object.keys(CATS)),pk(CITY),rnd(36,49)/10,rnd(3,65)/10,'active'];
const docs=(k,p)=>{const d={};k.forEach(x=>d[x]=Math.random()<p);return d};
const mkApp=()=>{const c=pk(Object.keys(CATS));return{n:POOL.pop(),cat:c,city:pk(CITY),docs:docs(['CAC certificate','Director ID','Bank account name match','Pickup address visit'],.6),who:'Applied just now · '+rnd(6,30)+' products'}};
const mkRA=()=>{const f=Math.random()<.5;return{n:f?pk(['Delta Dispatch Co-op','Eko Fleet Riders','Musa Logistics','Island Movers']):pk(FN)+' '+pk(['Eze','Bello','Okon','Adeyemi']),cat:f?'Fleet · '+rnd(6,30)+' riders':'Independent rider',city:pk(CITY),docs:docs(['Business registration','Rider licences','Vehicle papers','Guarantor forms'],.65),who:'Applied just now'}};
let seq=20521;
function mkOrder(st,ago,id){const b=pk(BR.filter(x=>x[5]==='active')),r=CATS[b[1]],r2=Math.random(),started=['rider','transit','done'].includes(st);
 return{id:id||'ASO-'+(seq++),b:b[0],c:pk(FN)+' '+pk(LN),z:pk(AREA),t:Math.round(rnd(r[0],r[1])/500)*500,d:st==='cancel'?0:rnd(18,28)*100,m:r2<.55?'Card':r2<.85?'Transfer':'Pay on delivery',st,p:started&&PN().length?pk(PN()):'–',ago}}
BR=POOL.splice(0,7).map(mkBrand);APP=POOL.splice(0,3).map(mkApp);RA=[mkRA(),mkRA()];
(function(){const sts=shuf(['await','await','pack','rider','transit','transit','transit']).concat(shuf(['done','done','done','done','done','done','done','done','cancel','cancel']));
 O.length=0;let a=0;sts.forEach((st,i)=>{a+=rnd(4,12);O.push(mkOrder(st,a,'ASO-'+(20520-i)))});
 const dn=O.filter(o=>o.st==='done');S=dn.slice(0,5).map(o=>({id:o.id,v:o.b,g:o.t,left:rnd(3,POL[pol][2]),st:'held'}));
 S[1].st='frozen';S[1].open=true;S[1].left=rnd(10,30);S[1].who='Customer, '+pk(AREA);S[1].note=pk(['Ordered size 42 but received size 40.','Wrong colour delivered: ordered black, got navy.','Item arrived with a torn seam.','Customer received a different style.']);
 S.push({id:'ASO-204'+rnd(10,59),v:BR[0][0],g:rnd(20,90)*1000,left:0,st:'released'})})();
function notice(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3000);AUD.unshift(['System',m]);if(AUD.length>40)AUD.length=40}
function refresh(){const y=scrollY;render();scrollTo(0,y)}
function tick(){const r=Math.random();
 if(r<.32){const o=mkOrder('await',0);O.unshift(o);notice('🔔 New order '+o.id+' · '+o.b+' · '+N(o.t))}
 else{const on=O.filter(o=>ONG.includes(o.st));if(on.length){const o=pk(on);
  if(o.st==='await'){if(Math.random()<.15){o.st='cancel';o.d=0;notice(o.id+' cancelled: '+o.b+' didn’t respond in 60 minutes')}else o.st='pack'}
  else if(o.st==='pack'){if(PN().length){o.st='rider';o.p=pk(PN())}}
  else if(o.st==='rider')o.st='transit';
  else{o.st='done';S.unshift({id:o.id,v:o.b,g:o.t,left:POL[pol][2],st:'held'});notice('✅ '+o.id+' delivered. Payout held '+POL[pol][2]+'h')}}}
 O.forEach(o=>{if(ONG.includes(o.st))o.ago+=2});
 S.forEach(x=>{if(x.st==='held'){x.left-=1;if(x.left<=0){x.left=0;x.st='released';notice('💸 '+N(x.g*(1-FEE))+' released to '+x.v)}}});hours++;
 const h=S.filter(x=>x.st==='held');
 if(Math.random()<.05&&h.length){const x=pk(h);x.st='frozen';x.open=true;x.who='Customer, '+pk(AREA);x.note=pk(['Wrong size delivered.','Item doesn’t match the photo.','Wrong colour delivered.']);notice('⚠️ Dispute opened on '+x.id+'. Payout frozen.')}
 if(Math.random()<.06&&POOL.length&&APP.length<5){const a=mkApp();APP.push(a);notice('📝 New brand application: '+a.n)}
 if(Math.random()<.04&&RA.length<4){const a=mkRA();RA.push(a);notice('🛵 New dispatch application: '+a.n)}
 if(O.length>80)O.length=80;if(S.length>60)S.length=60;
 refresh()}
let LIVE=true,SP=3500,tm;
const st2=document.createElement('style');st2.textContent='.live{position:absolute;top:26px;right:28px;display:flex;gap:8px;align-items:center}@media(max-width:820px){.live{position:static;margin-bottom:12px}}@keyframes bl{50%{opacity:.35}}.live .pill.g{animation:bl 1.4s infinite}@media (prefers-reduced-motion:reduce){.live .pill.g{animation:none}}';document.head.appendChild(st2);
const lc=document.createElement('div');lc.className='live';document.querySelector('main').style.position='relative';document.querySelector('main').prepend(lc);
function lcr(){lc.innerHTML=`<span class="pill ${LIVE?'g':''}">${LIVE?'● LIVE':'Paused'}</span><button class="btn ghost" onclick="LIVE=!LIVE;lcr();sched()">${LIVE?'Pause':'Resume'}</button><button class="btn ghost" onclick="SP=SP===3500?1400:3500;lcr();sched()">${SP===3500?'Speed up':'Normal speed'}</button>`}
function sched(){clearInterval(tm);if(LIVE)tm=setInterval(tick,SP)}
lcr();sched();
render();
</script>
</body>
</html>
